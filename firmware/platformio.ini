; ooo Firmware – ESP32 Wake-Trigger
; Flashen:  pio run -t upload && pio device monitor
; Board anpassen, falls kein klassischer ESP32 (z. B. esp32-s3-devkitc-1).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv   ; 3 MB App statt 1,3 MB (kein OTA noetig)
upload_speed = 460800
monitor_filters = esp32_exception_decoder, time
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    marian-craciunescu/ESP32Ping@^1.7
    tzapu/WiFiManager@^2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=1
